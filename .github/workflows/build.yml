name: Build & Release myBrowser

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore and write keystore.properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > mybrowser-release.keystore
          cat > keystore.properties <<EOF
          storeFile=../mybrowser-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build and sign release APK
        run: ./gradlew assembleGenericRelease -PnoSplits

      - name: List APKs
        run: find app/build/outputs/apk/generic/release -name "*.apk" | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myBrowser-release
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "myBrowser build #${{ github.run_number }}"
          prerelease: true
          files: app/build/outputs/apk/generic/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
